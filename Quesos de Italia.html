<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quesos de Italia</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#2b2a26;--mu:#7a7468;--ac:#c28a00;--gr:#2f7d4f;--rd:#c0392b;--sea:#e6eef3;--land:#f1e3b8;--ln:#d9cfb5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b18;--card:#27251f;--tx:#efeadb;--mu:#a59f8e;--sea:#222c33;--land:#4a4128;--ln:#5a5036}}
:root[data-theme="dark"]{--bg:#1c1b18;--card:#27251f;--tx:#efeadb;--mu:#a59f8e;--sea:#222c33;--land:#4a4128;--ln:#5a5036}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
header{text-align:center;padding:22px 16px 6px}
h1{margin:0;font-size:clamp(26px,5vw,40px)}
.flag{height:4px;width:120px;margin:10px auto;background:linear-gradient(90deg,var(--gr) 33%,#fff 33% 66%,var(--rd) 66%);border-radius:2px;border:1px solid var(--ln)}
header p{margin:0;color:var(--mu);font-style:italic;font-size:15px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;max-width:1000px;margin:14px auto;padding:0 14px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.map{background:var(--sea);border-radius:14px;padding:6px}
svg{width:100%;height:auto;display:block}
.wrap{position:relative}.wrap img{width:100%;height:auto;display:block;border-radius:10px}.pin{position:absolute;width:max(2.6%,22px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--ac);border:2px solid #fff;color:#fff;font:bold clamp(9px,1.4vw,14px) sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 5px #0007}.pin:hover,.pin.on{background:var(--rd);transform:translate(-50%,-50%) scale(1.3);z-index:2}
.panel{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--ln);align-self:start}
.panel h2{margin:0 0 6px;font-size:24px}
.tags span{display:inline-block;font-size:12px;border:1px solid var(--ln);border-radius:20px;padding:2px 10px;margin:0 6px 6px 0;color:var(--mu)}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);margin:14px 0 4px}
.panel p{margin:0;line-height:1.5;font-size:15px}
.src a{color:var(--ac);font-weight:bold;word-break:break-word}.src{font-size:13px!important;color:var(--mu);margin-top:12px!important}
.chips{max-width:1000px;margin:0 auto 24px;padding:0 14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{font:13px Georgia,serif;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:5px 11px;cursor:pointer}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 16px 24px}
</style></head><body>

const D=[
{n:"Parmigiano Reggiano",t:"Duro de largo estacionamiento",r:"Emilia-Romaña",x:42.97,y:43.46,d:"Rey de los quesos italianos. Se elabora con leche cruda de vaca y madura largos meses; es la base de la cocina italiana, rallado o en lascas.",e:"DOP. Solo se produce en Parma, Reggio Emilia, Módena, Bolonia (margen izquierda del Reno) y Mantua (margen derecha del Po), con leche cruda y mínimo 12 meses de maduración. El Consorcio inspecciona cada horma y le otorga su sello.",f:"Consorzio del Formaggio Parmigiano Reggiano",u:"https://www.parmigianoreggiano.com/"},
{n:"Grana Padano",t:"Duro de largo estacionamiento",r:"Llanura del Po",x:42.64,y:37.11,d:"Queso de gránulo fino, más suave y económico que el Parmigiano. Según el Consorcio, es el queso DOP más consumido del mundo.",e:"DOP. Se produce en la llanura del Po (Piamonte, Lombardía, Véneto, Trentino y parte de Emilia-Romaña). Madura como mínimo 9 meses y la versión Riserva supera los 20 meses.",f:"Consorzio Tutela Grana Padano",u:"https://www.granapadano.it/"},
{n:"Pecorino Romano",t:"Duro de largo estacionamiento",r:"Lacio / Cerdeña",x:48.70,y:64.65,d:"Queso de leche entera de oveja, salado y picante. Muy usado rallado en la pasta romana; casi toda la producción actual es sarda.",e:"DOP. Abarca todo el Lacio, toda Cerdeña y la provincia toscana de Grosseto. Se consume de mesa desde los 5 meses y para rallar desde los 8.",f:"Consorzio per la Tutela del Formaggio Pecorino Romano",u:"https://www.pecorinoromano.it/"},
{n:"Provolone",t:"Duro / semiduro de pasta hilada",r:"Lombardía y Véneto",x:48.05,y:39.06,d:"Pasta hilada de leche de vaca, con forma de pera, salame o cilindro. En Argentina se produce como 'provolone' en las principales cuencas lecheras.",e:"Provolone Valpadana DOP: Lombardía, Véneto, Emilia-Romaña y Trentino. Existen dos tipologías: dolce (suave) y piccante (más intenso y maduro).",f:"Consorzio Tutela Provolone Valpadana",u:"https://www.provolonevalpadana.it/"},
{n:"Asiago",t:"Semiduro",r:"Véneto y Trentino",x:51.43,y:32.42,d:"Nace en las montañas de Vicenza y Trento. Se elabora en versión Pressato (joven, blando) y d'Allevo (madurado, más firme y sabroso).",e:"DOP en Vicenza, Trento y partes de Padua y Treviso. Reconoce la mención 'prodotto della montagna' para el queso de altura.",f:"Consorzio Tutela Formaggio Asiago",u:"https://www.asiagocheese.it/"},
{n:"Fontina",t:"Semiduro",r:"Valle de Aosta",x:33.85,y:29.10,d:"Queso alpino de leche cruda, de pasta tierna, aroma intenso y gusto dulce. Es la base de la fondue valdostana.",e:"DOP exclusiva del Valle de Aosta, con leche de vacas de raza Valdostana alimentadas con pasturas de montaña. Madura en cuevas naturales excavadas en la roca.",f:"Consorzio Produttori e Tutela della DOP Fontina",u:"https://www.fontina-dop.it/"},
{n:"Montasio",t:"Semiduro",r:"Friuli-Venecia Julia",x:57.29,y:33.01,d:"Queso friulano de leche de vaca que se consume fresco o madurado; el más joven es suave y el más añejo se usa para rallar.",e:"DOP elaborada en todo Friuli-Venecia Julia y en Belluno, Treviso, Padua y Venecia. Se comercializa fresco, mezzano, stagionato y stravecchio.",f:"Consorzio per la Tutela del Formaggio Montasio",u:"https://www.montasio.com/"},
{n:"Scamorza",t:"Semiduro de pasta hilada",r:"Abruzzo y Molise",x:56.51,y:56.15,d:"Pasta hilada con forma de pera, atada con cuerda. La variante ahumada (affumicata) es muy típica de Abruzzo y Molise; excelente a la plancha.",e:"No cuenta con DOP ni consorcio propio. Es un queso tradicional del sur, elaborado hoy en toda Italia con la misma técnica de pasta hilada que el provolone.",f:"Elaboración tradicional (sin consorcio)"},
{n:"Taleggio",t:"Blando de corteza lavada",r:"Lombardía",x:40.23,y:28.91,d:"Cuadrado, de pasta blanda y corteza lavada, aroma marcado y sabor suave y ligeramente ácido. Madura en ambientes fríos y húmedos.",e:"DOP en Bérgamo, Brescia, Como, Cremona, Lecco, Lodi, Milán, Pavía, Treviso y Novara. Madura como mínimo 35 días.",f:"Consorzio Tutela Formaggio Taleggio",u:"https://www.taleggio.it/"},
{n:"Gorgonzola",t:"Blando / semiblando azul",r:"Piamonte y Lombardía",x:36.78,y:34.18,d:"Queso azul con vetas de Penicillium. Cremoso y dulce o firme y picante; se usa en salsas, risottos y tablas.",e:"DOP del Piamonte (Novara, Vercelli, Cuneo, Biella, Verbano-Cusio-Ossola, Alessandria) y Lombardía. Se presenta en dos versiones: dolce y piccante.",f:"Consorzio Tutela Gorgonzola",u:"https://www.gorgonzola.com/"},
{n:"Mozzarella di Bufala Campana",t:"Pasta hilada fresca",r:"Campania",x:58.07,y:70.51,d:"Mozzarella de leche entera de búfala, de sabor lácteo y ligeramente ácido. Se consume fresca, con tomate y albahaca o sobre la pizza.",e:"DOP en Campania (núcleo en Caserta y Salerno), zonas del Lacio, Foggia y Venafro. Las búfalas se crían en llanuras húmedas como la Piana del Sele.",f:"Consorzio per la Tutela del Formaggio Mozzarella di Bufala Campana",u:"https://www.formaggiomozzarelladibufala.it/"},
{n:"Mozzarella fior di latte",t:"Pasta hilada fresca",r:"Campania y sur del Lacio",x:54.17,y:69.92,d:"La mozzarella de leche de vaca, más suave y económica que la de búfala. Es la preferida para la pizza.",e:"'Mozzarella' es una Especialidad Tradicional Garantizada (STG): protege la receta y no el origen geográfico, por eso se elabora en toda Italia y en el mundo.",f:"Denominación europea STG"},
{n:"Burrata",t:"Pasta hilada fresca rellena",r:"Puglia",x:67.71,y:71.29,d:"Bolsa de mozzarella rellena de stracciatella y nata, cerrada con un nudo. Al cortarla, el interior cremoso se derrama.",e:"IGP Burrata di Andria, en la región de Puglia. Andria es su cuna, aunque hoy se hace en toda Italia y en muchos países. Se consume muy fresca.",f:"Consorzio per la Tutela della Burrata di Andria IGP"},
{n:"Ricotta",t:"Derivado del suero",r:"Toda Italia (Sicilia)",x:51.43,y:86.43,d:"Se obtiene calentando el suero sobrante de otros quesos. En Sicilia es clave en la pastelería (cannoli, cassata); la 'ricotta salata' madurada se usa para rallar.",e:"Existen DOP para la Ricotta Romana (Lacio, de oveja) y la Ricotta di Bufala Campana.",f:"DOP Ricotta Romana / Ricotta di Bufala Campana"},
{n:"Mascarpone",t:"Derivado de la crema",r:"Lombardía",x:43.88,y:33.01,d:"Crema espesa y dulce, base del tiramisú. Se coagula con ácido tartárico o cítrico, sin cuajo.",e:"No tiene DOP. Su cuna es el Lodigiano, entre Lodi y Abbiategrasso, en la llanura lombarda.",f:"Producto tradicional lombardo (sin consorcio)"}];

const q=p.children;q[0].textContent=k.n;q[1].children[0].textContent=k.t;q[1].children[1].textContent=k.r;q[3].textContent=k.d;q[5].textContent=k.e;if(k.u){q[6].textContent='Sitio oficial del consorcio: ';const a=document.createElement('a');a.href=k.u;a.target='_blank';a.rel='noopener noreferrer';a.textContent=k.f+' ↗';q[6].appendChild(a)}else q[6].textContent='Referencia: '+k.f;
